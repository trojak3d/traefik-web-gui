<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traefik Web GUI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            height: 90vh;
        }

        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 15px 20px;
            background: #2c3e50;
            color: white;
            border-bottom: 1px solid #34495e;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 16px;
            margin: 0;
            margin-bottom: 4px;
            white-space: nowrap;
        }

        .header p {
            font-size: 11px;
            opacity: 0.7;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }
        
        .user-badge {
            font-size: 11px;
            opacity: 0.9;
            white-space: nowrap;
        }
        
        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .file-item {
            padding: 12px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item:hover {
            background: #f8f9fa;
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }

        .file-item.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .file-name {
            flex: 1;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size {
            font-size: 11px;
            opacity: 0.6;
            margin-left: 8px;
        }

        .file-item.active .file-size {
            opacity: 0.8;
        }

        .sidebar-actions {
            padding: 15px;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 8px;
        }

        .btn-new {
            flex: 1;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-new:hover {
            background: #218838;
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-info {
            flex: 1;
        }

        .file-info h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .file-meta {
            font-size: 12px;
            color: #6c757d;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .editor {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            border: 1px solid #e9ecef;
        }

        .editor-line-numbers {
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
            padding: 20px 10px;
            text-align: right;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            color: #6c757d;
            overflow: hidden;
            user-select: none;
            line-height: 1.5;
            white-space: pre;
            min-width: 40px;
        }

        #line-numbers-sync {
            position: absolute;
            left: -9999px;
            top: -9999px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            padding: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            border: none;
            visibility: hidden;
        }

        .editor-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        textarea {
            flex: 1;
            border: none;
            padding: 20px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: none;
            outline: none;
            background: white;
            white-space: pre;
            overflow-wrap: normal;
            word-wrap: normal;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            font-size: 16px;
            text-align: center;
            padding: 40px;
        }

        .alert {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 13px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modal h2 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            font-size: 13px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            resize: vertical;
        }

        .form-group textarea {
            height: 200px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
        }

        .btn-cancel:hover {
            background: #5a6268;
        }

        .status-bar {
            padding: 10px 20px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
            font-size: 12px;
            color: #6c757d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-left {
            flex: 1;
        }

        .status-right {
            text-align: right;
        }

        .modified-indicator {
            color: #ffc107;
            font-weight: bold;
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 300px;
                border-right: none;
                border-bottom: 1px solid #e9ecef;
            }

            .editor-panel {
                flex: 1;
            }
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .file-actions {
            display: flex;
            gap: 5px;
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .confirmation {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            color: #856404;
            font-size: 13px;
            display: none;
        }

        .confirmation.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="header">
                <div>
                    <h1>📋 Traefik Configs</h1>
                    <p id="config-dir"></p>
                </div>
                <div class="header-info">
                    <div class="user-badge">👤 {{ username }}</div>
                    <a href="/logout" class="logout-btn">Logout</a>
                </div>
            </div>

            <div class="file-list" id="file-list">
                <div style="text-align: center; color: #6c757d; padding: 20px; font-size: 13px;">
                    Loading files...
                </div>
            </div>

            <div class="sidebar-actions">
                <button class="btn-new" onclick="openNewFileModal()">+ New File</button>
            </div>
        </div>

        <!-- Editor -->
        <div class="editor-panel">
            <div class="editor-header">
                <div class="file-info">
                    <h2 id="current-file">Select a file to edit</h2>
                    <div class="file-meta">
                        <span id="file-modified"></span>
                        <span id="file-size"></span>
                    </div>
                </div>
                <div class="editor-actions">
                    <button class="btn btn-primary" id="save-btn" onclick="saveFile()" disabled>Save</button>
                    <button class="btn btn-danger" id="delete-btn" onclick="confirmDelete()" disabled>Delete</button>
                    <button class="btn btn-warning" id="restart-btn" onclick="restartTraefik()" title="Reload Traefik config">🔄 Restart Traefik</button>
                </div>
            </div>

            <div class="editor">
                <div class="editor-line-numbers" id="line-numbers"></div>
                <div class="editor-content">
                    <div id="alerts-container"></div>
                    <textarea id="editor" placeholder="Select a file to edit..." disabled></textarea>
                    <div id="line-numbers-sync"></div>
                </div>
            </div>

            <div class="status-bar">
                <div class="status-left">
                    <span id="file-status"></span>
                </div>
                <div class="status-right">
                    <span id="line-count">0 lines</span>
                </div>
            </div>
        </div>
    </div>

    <!-- New File Modal -->
    <div class="modal" id="new-file-modal">
        <div class="modal-content">
            <h2>Create New File</h2>
            <div class="form-group">
                <label>Filename (must end with .yml or .yaml)</label>
                <input type="text" id="new-filename" placeholder="config.yml" />
            </div>
            <div class="form-group">
                <label>Content</label>
                <textarea id="new-content" placeholder="http:
  services:
    myapp:
      loadBalancer:
        servers:
          - url: http://localhost:3000"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeNewFileModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createFile()">Create</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="delete-modal">
        <div class="modal-content">
            <h2>Delete File?</h2>
            <p id="delete-filename"></p>
            <div class="confirmation active">
                ⚠️ This action cannot be undone. The file will be permanently deleted.
            </div>
            <p style="margin-top: 15px; font-size: 14px; color: #495057;">Type the filename to confirm:</p>
            <input type="text" id="delete-confirm-input" placeholder="Enter filename" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #dee2e6; border-radius: 4px; font-size: 14px;">
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" id="delete-confirm-btn" onclick="deleteFile()" disabled>Delete</button>
            </div>
        </div>
    </div>

    <script>
        let currentFile = null;
        let fileContent = null;
        let hasChanges = false;
        const editor = document.getElementById('editor');

        // Track changes
        editor.addEventListener('input', () => {
            hasChanges = true;
            updateModifiedIndicator();
            updateLineCount();
        });

        // Sync scroll between editor and line numbers
        editor.addEventListener('scroll', () => {
            const lineNumbers = document.getElementById('line-numbers');
            lineNumbers.scrollTop = editor.scrollTop;
        });

        // Load files on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadFileList();
            loadStatus();
            document.getElementById('delete-confirm-input').addEventListener('input', validateDeleteInput);
        });

        function showAlert(message, type = 'info') {
            const alertsContainer = document.getElementById('alerts-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertsContainer.appendChild(alert);
            
            setTimeout(() => alert.remove(), 5000);
        }

        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                document.getElementById('config-dir').textContent = `📁 ${data.config_dir} (${data.file_count} files)`;
            } catch (error) {
                console.error('Error loading status:', error);
            }
        }

        async function loadFileList() {
            try {
                const response = await fetch('/api/files');
                const data = await response.json();
                const fileList = document.getElementById('file-list');
                
                if (data.files.length === 0) {
                    fileList.innerHTML = '<div style="text-align: center; color: #6c757d; padding: 20px; font-size: 13px;">No YAML files found</div>';
                    return;
                }

                fileList.innerHTML = '';
                data.files.forEach(file => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.dataset.filename = file.name;
                    fileItem.addEventListener('click', () => loadFile(file.name));
                    
                    const fileName = document.createElement('span');
                    fileName.className = 'file-name';
                    fileName.textContent = '📄 ' + file.name;
                    
                    const fileSize = document.createElement('span');
                    fileSize.className = 'file-size';
                    fileSize.textContent = formatSize(file.size);
                    
                    fileItem.appendChild(fileName);
                    fileItem.appendChild(fileSize);
                    fileList.appendChild(fileItem);
                });
            } catch (error) {
                console.error('Error loading files:', error);
                showAlert('Error loading files', 'error');
            }
        }

        async function loadFile(filename) {
            if (hasChanges) {
                if (!confirm('You have unsaved changes. Continue?')) {
                    return;
                }
            }

            try {
                const response = await fetch(`/api/file/${encodeURIComponent(filename)}`);
                if (!response.ok) throw new Error('File not found');
                
                const data = await response.json();
                currentFile = filename;
                fileContent = data.content;
                hasChanges = false;

                editor.value = data.content;
                editor.disabled = false;

                document.getElementById('current-file').textContent = filename;
                document.getElementById('file-modified').textContent = `Last modified: ${data.modified}`;
                document.getElementById('file-size').textContent = `${formatSize(data.size)}`;
                document.getElementById('save-btn').disabled = false;
                document.getElementById('delete-btn').disabled = false;

                // Update active file item
                document.querySelectorAll('.file-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.filename === filename);
                });

                updateModifiedIndicator();
                updateLineCount();
            } catch (error) {
                console.error('Error loading file:', error);
                showAlert('Error loading file', 'error');
            }
        }

        async function saveFile() {
            if (!currentFile) return;

            try {
                const response = await fetch(`/api/file/${encodeURIComponent(currentFile)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: editor.value })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    showAlert(data.error || 'Error saving file', 'error');
                    return;
                }

                hasChanges = false;
                fileContent = editor.value;
                document.getElementById('file-modified').textContent = `Last modified: ${data.modified}`;
                updateModifiedIndicator();
                showAlert(data.message, 'success');
                loadFileList();
            } catch (error) {
                console.error('Error saving file:', error);
                showAlert('Error saving file', 'error');
            }
        }

        function openNewFileModal() {
            document.getElementById('new-file-modal').classList.add('active');
            document.getElementById('new-filename').focus();
        }

        function closeNewFileModal() {
            document.getElementById('new-file-modal').classList.remove('active');
            document.getElementById('new-filename').value = '';
            document.getElementById('new-content').value = '';
        }

        async function createFile() {
            const filename = document.getElementById('new-filename').value.trim();
            const content = document.getElementById('new-content').value;

            if (!filename) {
                showAlert('Please enter a filename', 'error');
                return;
            }

            try {
                const response = await fetch('/api/file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, content })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    showAlert(data.error || 'Error creating file', 'error');
                    return;
                }

                closeNewFileModal();
                showAlert(data.message, 'success');
                loadFileList();
            } catch (error) {
                console.error('Error creating file:', error);
                showAlert('Error creating file', 'error');
            }
        }

        function confirmDelete() {
            if (!currentFile) return;
            document.getElementById('delete-filename').textContent = `Delete "${currentFile}"?`;
            document.getElementById('delete-confirm-input').value = '';
            document.getElementById('delete-confirm-input').focus();
            document.getElementById('delete-confirm-btn').disabled = true;
            document.getElementById('delete-modal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.remove('active');
        }

        function validateDeleteInput() {
            const input = document.getElementById('delete-confirm-input').value;
            const deleteBtn = document.getElementById('delete-confirm-btn');
            deleteBtn.disabled = input !== currentFile;
        }

        async function deleteFile() {
            if (!currentFile) return;

            const confirmInput = document.getElementById('delete-confirm-input').value;
            if (confirmInput !== currentFile) {
                showAlert('Filename does not match', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/file/${encodeURIComponent(currentFile)}`, {
                    method: 'DELETE'
                });

                const data = await response.json();
                
                if (!response.ok) {
                    showAlert(data.error || 'Error deleting file', 'error');
                    return;
                }

                closeDeleteModal();
                showAlert(data.message, 'success');
                currentFile = null;
                hasChanges = false;
                editor.value = '';
                editor.disabled = true;
                document.getElementById('current-file').textContent = 'Select a file to edit';
                document.getElementById('file-modified').textContent = '';
                document.getElementById('file-size').textContent = '';
                loadFileList();
            } catch (error) {
                console.error('Error deleting file:', error);
                showAlert('Error deleting file', 'error');
            }
        }

        async function restartTraefik() {
            const restartBtn = document.getElementById('restart-btn');
            const originalText = restartBtn.textContent;
            
            restartBtn.disabled = true;
            restartBtn.textContent = '⏳ Restarting...';
            
            let restartCommandSent = false;
            
            try {
                const response = await fetch('/api/traefik/restart', {
                    method: 'POST'
                });

                const data = await response.json();
                
                if (!response.ok) {
                    showAlert(data.error || 'Error restarting Traefik', 'error');
                    restartBtn.disabled = false;
                    restartBtn.textContent = originalText;
                    return;
                }
                
                restartCommandSent = true;
            } catch (error) {
                // Network error is expected during restart (connection drops)
                // The command likely succeeded even though we got an error
                console.log('Network error during restart (expected):', error.message);
                restartCommandSent = true;
            }

            // If restart command was sent (or attempted), wait and check status
            if (!restartCommandSent) {
                restartBtn.disabled = false;
                restartBtn.textContent = originalText;
                return;
            }

            // Wait for service to restart
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            // Check if Traefik is actually running (retry up to 5 times)
            let traefikRunning = false;
            for (let attempt = 0; attempt < 5; attempt++) {
                try {
                    const statusResponse = await fetch('/api/traefik/status');
                    const statusData = await statusResponse.json();
                    
                    if (statusData.running) {
                        traefikRunning = true;
                        break;
                    }
                } catch (e) {
                    // Status check failed (expected while service is restarting)
                    console.log('Status check failed (attempt ' + (attempt + 1) + ')');
                }
                
                if (attempt < 4) {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }
            
            // Show result based on whether we could confirm it's running
            if (traefikRunning) {
                showAlert('✓ Traefik restarted successfully', 'success');
            } else {
                showAlert('Traefik restart initiated. If it does not start, check: journalctl -u traefik -n 20', 'info');
            }
            
            restartBtn.disabled = false;
            restartBtn.textContent = originalText;
        }

        function updateModifiedIndicator() {
            const saveBtn = document.getElementById('save-btn');
            const fileStatus = document.getElementById('file-status');
            
            if (hasChanges) {
                saveBtn.classList.add('btn-modified');
                fileStatus.innerHTML = '<span class="modified-indicator">●</span>Modified - save to apply changes';
            } else {
                saveBtn.classList.remove('btn-modified');
                fileStatus.textContent = 'Saved';
            }
        }

        function updateLineCount() {
            const lines = editor.value.split('\n').length;
            document.getElementById('line-count').textContent = `${lines} ${lines === 1 ? 'line' : 'lines'}`;
            
            // Update line numbers
            const lineNumbers = document.getElementById('line-numbers');
            let html = '';
            for (let i = 1; i <= lines; i++) {
                html += i;
                if (i < lines) {
                    html += '\n';
                }
            }
            lineNumbers.textContent = html;
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 10) / 10 + ' ' + sizes[i];
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                if (currentFile && hasChanges) saveFile();
            }
        });
    </script>
</body>
</html>
